name: sync

# Pulls the CLI's released facts into src/data/cli.json and pushes the result,
# which is what triggers a Vercel deploy. Three ways in:
#   - repository_dispatch, fired by the puravida repo's own release workflow,
#     so a release updates the site within a minute of the tag
#   - a daily cron, which catches a release that fired nothing
#   - manual, for when you want to force it
on:
  repository_dispatch:
    types: [cli-release]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Sync from the CLI's latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm sync

      # Build before pushing: a README restructure that breaks the parser should
      # fail here rather than deploy a half-empty page.
      - run: pnpm check && pnpm build

      - name: Commit if the CLI moved
        run: |
          if git diff --quiet -- src/data/cli.json; then
            echo "cli.json unchanged — nothing to deploy"
            exit 0
          fi
          version=$(node -p "require('./src/data/cli.json').version")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cli.json
          git commit -m "chore(content): sync cli data for v${version}"
          git push
